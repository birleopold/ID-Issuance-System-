[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-studio"
version = "0.2.0"
description = "Offline Windows identity card enrollment, design, approval and issuance workstation"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.3", "pywin32==310; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0"]

[project.scripts]
credential-studio = "idstudio.app:main"

[tool.setuptools.packages.find]
include = ["idstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
